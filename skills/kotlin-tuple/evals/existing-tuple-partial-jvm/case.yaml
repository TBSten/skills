  generate.py の preflight が既存の jp.fuga.batch.legacy の Tuple4 / Tuple5 を検出して exit 3 (ACTION_REQUIRED) を返すので、
  勝手に --ignore-existing で再実行したり既存ファイルを消したりせず、
  (a) 両方残して --ignore-existing で続行 / (b) 別パッケージ・出力先 / (c) 中止 のどれにするかをユーザーに確認する。
  kotlinx-serialization の依存は追加しない。
