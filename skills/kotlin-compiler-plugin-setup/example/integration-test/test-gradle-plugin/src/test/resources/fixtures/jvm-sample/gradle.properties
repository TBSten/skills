# The fixture runs as a child Gradle daemon started by TestKit, alongside the parent build.
# Without explicit limits it uses Gradle's defaults (512 MiB heap / 384 MiB metaspace), and
# loading the Kotlin compiler + this compiler plugin can die with
# "OutOfMemoryError: Metaspace" — a flaky failure that hits a different test each run.
# Keep it modest so the child does not starve the parent on CI runners.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
