# ---------- Project (SSoT) ----------
# Maven coordinates of every published module = GROUP:<project.name>:VERSION_NAME
# (applied in the root build.gradle.kts). The Gradle plugin embeds these values at build time
# (gradle-plugin/build.gradle.kts -> generated BuildConfig), so bump the version only here.
GROUP=com.example.compilerpluginsetup
VERSION_NAME=0.1.0
COMPILER_PLUGIN_ID=com.example.compilerpluginsetup
# Kotlin versions the Gradle plugin accepts (consumer-side guard, see <Prefix>KotlinVersionGuard):
#   < MIN                 -> build error
#   >= MAX_TESTED_EXCLUSIVE -> warning only
SUPPORTED_KOTLIN_MIN=2.3.0
SUPPORTED_KOTLIN_MAX_TESTED_EXCLUSIVE=2.4.0

# ---------- POM (read automatically by com.vanniktech.maven.publish) ----------
# TODO: Fill in before the first release (Maven Central rejects empty url / scm / developer).
POM_URL=https://github.com/TODO-owner/example-plugin
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/TODO-owner/example-plugin
POM_SCM_CONNECTION=scm:git:https://github.com/TODO-owner/example-plugin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/TODO-owner/example-plugin.git
POM_DEVELOPER_ID=TODO-owner
POM_DEVELOPER_NAME=TODO-owner
POM_DEVELOPER_URL=https://github.com/TODO-owner

# ---------- Gradle ----------
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true

# ---------- Kotlin ----------
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true
# https://youtrack.jetbrains.com/issue/KT-82395
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
