# CI for the pinned Kotlin version (gradle/libs.versions.toml).
# Multi-Kotlin-version matrix: add the kotlin-compiler-plugin-dev skill's
# assets/workflows/compiler-plugin-test.yml when you support several Kotlin versions.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.local/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.local/**'
  workflow_call:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Cancel superseded PR runs, but never runs on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # One task per line (scaffold.sh drops the lines of skipped modules).
      - name: Unit / integration tests
        run: >-
          ./gradlew --stacktrace
          :compiler-plugin:test
          :gradle-plugin:test
          :runtime:jvmTest
          :integration-test:test-jvm:run
          :integration-test:test-kmp:jvmRun
          :integration-test:test-gradle-plugin:test
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-test
          path: '**/build/reports/**'

  publish-local:
    name: publishToMavenLocal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Catches POM / publication wiring errors before a release.
      - run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace

  # Single required check for branch protection.
  final:
    if: always()
    runs-on: ubuntu-latest
    needs: [test, publish-local]
    steps:
      - name: Check all results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Results: $results"
          if echo "$results" | grep -q -E '(failure|cancelled)'; then
            echo "One or more required jobs failed"
            exit 1
          fi
