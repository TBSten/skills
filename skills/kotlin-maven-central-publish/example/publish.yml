name: Publish

on:
  release:
    # `published` は full release / pre-release の両方で発火する唯一の type。
    # `prereleased` は draft から公開した pre-release では発火せず、`released` は pre-release では発火しない。
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#release
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check + publishToMavenLocal only (no upload to Maven Central)'
        type: boolean
        default: true
      stage_only:
        description: 'Stage only: upload but leave the deployment in Central Portal for a manual Publish click'
        type: boolean
        default: false

# 2 つの publish が Central に並走するのは常に NG。走っている publish はキャンセルしない。
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Release build and publish to Maven Central
    # setup-publish.sh が Apple (ios/macos/tvos/watchos) ターゲットの有無で macos-latest / ubuntu-latest を選ぶ。
    # Apple ターゲットの klib は macOS でしかビルドできない。
    runs-on: <RUNNER>
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # バージョンの SSoT (version catalog / gradle.properties) から読み出す。
      - name: Read version
        id: version
        run: |
          version=$(<READ_VERSION_CMD>)
          if [ -z "$version" ]; then
            echo "::error::バージョンを読み出せませんでした。publish.yml の Read version ステップと SSoT を確認してください。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag matches the version
        if: ${{ github.event_name == 'release' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$tag" ]; then
            echo "::error::SSoT のバージョンは $VERSION、tag は $tag。揃えてから Release を作り直してください。"
            exit 1
          fi

      - name: Version is not a SNAPSHOT
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-SNAPSHOT)
              echo "::error::$VERSION は SNAPSHOT です。リリース版に上げてから publish してください。"
              exit 1
              ;;
          esac

      # 壊れた成果物を Central に出さないための最終確認。重い場合は公開対象モジュールの check に絞る。
      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish to Maven Local (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./gradlew publishToMavenLocal --stacktrace

      # --no-configuration-cache: publish は 1 回きりで CC の恩恵が無く、署名鍵などの秘密情報を
      # CC エントリに残さないため。gradle.properties で CC を有効にしていても publish 時だけ無効化する。
      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          STAGE_ONLY: ${{ inputs.stage_only }}
        run: |
          # release → 常に自動リリース。workflow_dispatch で stage_only=true の時だけ Central Portal に留める。
          if [ "$STAGE_ONLY" = "true" ]; then
            task=publishToMavenCentral
          else
            task=publishAndReleaseToMavenCentral
          fi
          echo "Running Gradle task: $task"
          ./gradlew "$task" --no-configuration-cache --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
