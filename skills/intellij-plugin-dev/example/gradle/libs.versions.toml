# These versions move together: when the target IDE changes, update the whole block
# (shifting one of them alone breaks against the IDE's bundled Kotlin / Jewel).

[versions]
# IntelliJ Platform Gradle Plugin (v2). Keep it equal to the plugins block of settings.gradle.kts,
# which cannot read this catalog.
intellijPlatformGradlePlugin = "2.18.1"
# The SDK to build against: 2026.1 = build 261.
intellijIdea = "2026.1"
# Must not be newer than the Kotlin bundled in the target IDE. The Compose Compiler plugin uses it too.
kotlin = "2.3.0"
# Compose Multiplatform for the standalone preview only. Verified with the Kotlin above. There is no
# official table of the minimum Kotlin per release; when moving either version, check the
# "Kotlin compatibility" section of the Compose Multiplatform docs (Kotlin 2.1.0+, Compose Compiler
# plugin at the same version as Kotlin) and the Compose version standalone Jewel is built against.
composeMultiplatform = "1.9.0"
# Standalone Jewel is published as "<jewel>-<jewelForIde>". jewelForIde is also the version of
# com.jetbrains.intellij.platform:icons.
jewel = "0.37.0"
jewelForIde = "261.26222.65"
# The platform no longer supplies JUnit 4, which BasePlatformTestCase is based on.
junit4 = "4.13.2"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Only for the standalone Compose Desktop of the headless preview.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
