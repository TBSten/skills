name: test
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kotlin: ["2.2.0", "2.2.20", "2.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :compiler-plugin:test -Ptest.kotlin=${{ matrix.kotlin }}
