# version catalog (バージョンの SSoT)。build-logic もこのファイルを共有する。
# @bootup:if integration-test
# integrationTest/ (独立ビルド) も同じファイルを読む。
# @bootup:end
#
# キー命名の注意: `foo` と `foo-bar` のように、あるキーが別キーの接頭辞 (+ 区切り文字) に
# なると accessor が衝突して asProvider() が必要になる。ビルド定数は camelCase にして避ける。

[versions]

# このライブラリ自身の publish バージョン。
# root build.gradle.kts の allprojects { version } と publish.yml の「tag == catalog」チェックが参照する。
example-lib = "0.1.0"

# ---- ビルド定数 (build-logic が libs.findVersion で読む) ----
jvmToolchain = "17"
# 公開 metadata を読める Kotlin の下限 (下位互換の床)。
# 既定 (= コンパイラと同じ 2.4) のままだと、利用側が Kotlin 2.2 / 2.3 のプロジェクトでは
# このライブラリのシンボルが Unresolved reference になる。下げるほど使える言語機能が減る。
# 変えたら README の「Kotlin 下限」も更新する。
kotlinLanguageVersion = "2.2"
# 推移的に入る kotlin-stdlib も床に揃える (揃えないと stdlib 側の metadata で同じ問題が起きる)
kotlinCoreLibrariesVersion = "2.2.20"
# @bootup:if kmp
androidCompileSdk = "36"
androidMinSdk = "23"
# @bootup:end

# ---- ツールチェーン ----
kotlin = "2.4.10"
# @bootup:if kmp
# com.android.kotlin.multiplatform.library (AGP 9 の KMP 用 Android plugin)
agp = "9.3.1"
# @bootup:end
maven-publish = "0.37.0"
dokka = "2.2.0"
binary-compatibility-validator = "0.18.1"
ktlintGradle = "14.2.0"
# ktlint 本体 (CLI) のバージョン。ktlintGradle とは別に上げる
ktlint = "1.8.0"
kotest = "6.2.5"
# @bootup:if kmp
# kotest を JS / Wasm / Native で動かすための KSP (kotest Gradle plugin が spec の launcher を生成する)。
# KSP2 は Kotlin と独立した版番号。Kotlin を上げたら対応する KSP を確認する
ksp = "2.3.12"
# @bootup:end

[libraries]

# このライブラリ自身の Maven 座標。利用側から見た依存の書き方の見本。
# @bootup:if integration-test
# integrationTest はこれで依存し、integrationTest/settings.gradle.kts の includeBuild("../") で
# ローカルのプロジェクトへ自動で置き換わる。
# @bootup:end
example-lib-core = { module = "<group-id>:example-lib-core", version.ref = "example-lib" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
# JVM (jvmTest / test) で kotest を JUnit Platform 上で動かす runner
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

[plugins]

# @bootup:if kmp
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotest = { id = "io.kotest", version.ref = "kotest" }
# @bootup:end
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
