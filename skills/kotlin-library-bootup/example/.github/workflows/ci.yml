# CI: lint / API 互換 / 各プラットフォームのテスト / publish の予行を並列に回し、
# 最後の `final` job で結果を 1 つに集約する (branch protection の required check は `final` だけでよい)。
name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.local/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.local/**'
  # publish.yml から publish 前のゲートとして呼ぶ
  workflow_call:
  workflow_dispatch:

# PR は新しい push で古い run を止める。main への push は 1 commit ずつ検証するので止めない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # setup-gradle は gradle-wrapper.jar の検証 (validate-wrappers) も既定で行う
      - uses: gradle/actions/setup-gradle@v6
      - name: ./gradlew ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-lint
          path: '**/build/reports/'
          retention-days: 7
          if-no-files-found: ignore

  api-check:
    name: api check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # 公開 API を変えたら ./gradlew apiDump して api/ の差分をコミットする
      - name: ./gradlew apiCheck
        run: ./gradlew apiCheck --stacktrace

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # @bootup:if kmp
          - { name: "jvm", tasks: "jvmTest", os: ubuntu-latest }
          # browser テストは runner 同梱の Chrome (headless) で動く
          - { name: "js / wasm", tasks: "jsTest wasmJsTest", os: ubuntu-latest }
          # commonTest を Android の JVM host で回し (withHostTest)、AAR が組めることも確かめる
          - { name: "android", tasks: "testAndroidHostTest assembleAndroidMain", android: true, os: ubuntu-latest }
          # macOS runner は高価なので Apple ターゲットだけをここで回す
          - { name: "ios", tasks: "iosSimulatorArm64Test compileKotlinIosArm64", konan: true, os: macos-latest }
          # @bootup:if full
          #~ - { name: "linux", tasks: "linuxX64Test", konan: true, os: ubuntu-latest }
          #~ - { name: "macos", tasks: "macosArm64Test", konan: true, os: macos-latest }
          #~ # watchos / tvos / mingw / androidNative / wasmWasi はコンパイルだけ確認する (テストは回さない)
          #~ - { name: "native compile (apple)", tasks: "compileKotlinWatchosArm64 compileKotlinTvosArm64", konan: true, os: macos-latest }
          #~ - { name: "native compile (other)", tasks: "compileKotlinMingwX64 compileKotlinLinuxArm64 compileKotlinAndroidNativeArm64 compileKotlinWasmWasi", konan: true, os: ubuntu-latest }
          # @bootup:end
          # @bootup:end
          # @bootup:if jvm
          #~ - { name: "jvm", tasks: "test", os: ubuntu-latest }
          # @bootup:end
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # @bootup:if kmp
      - name: Set up Android SDK
        if: ${{ matrix.android }}
        uses: android-actions/setup-android@v4
      - name: Cache Kotlin/Native (konan)
        if: ${{ matrix.konan }}
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-
      # @bootup:end
      - uses: gradle/actions/setup-gradle@v6
      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-test-${{ strategy.job-index }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # @bootup:if integration-test
  integration-test:
    name: integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # integrationTest/ は独立ビルド。Maven 座標で依存し includeBuild("../") でローカルに置き換える
      - name: ./gradlew -p integrationTest test
        run: ./gradlew -p integrationTest test --stacktrace
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-integration-test
          path: |
            integrationTest/**/build/reports/
            integrationTest/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # @bootup:end
  publish-local:
    name: publish to maven local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # POM / javadoc jar / sources jar が組めることの予行 (署名は publishToMavenLocal の時だけスキップされる)
      - name: ./gradlew publishToMavenLocal
        run: ./gradlew publishToMavenLocal --stacktrace

  # @bootup:if docs-site
  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: ./gradlew generateApiDocs
        run: ./gradlew generateApiDocs --stacktrace
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # lockfile をまだコミットしていない初期状態では cache を無効にする (setup-node が失敗するため)
          cache: ${{ hashFiles('docs/pnpm-lock.yaml') != '' && 'pnpm' || '' }}
          cache-dependency-path: ${{ hashFiles('docs/pnpm-lock.yaml') != '' && 'docs/pnpm-lock.yaml' || '' }}
      - name: pnpm install
        working-directory: docs
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::docs/pnpm-lock.yaml が無いので lockfile 無しで install する。pnpm install で生成してコミットすること"
            pnpm install --no-frozen-lockfile
          fi
      - name: pnpm run build
        working-directory: docs
        run: pnpm run build

  # @bootup:end
  # branch protection 用の集約 job。どれか 1 つでも failure / cancelled なら落ちる
  final:
    name: final
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - api-check
      - test
      - publish-local
      # @bootup:if integration-test
      - integration-test
      # @bootup:end
      # @bootup:if docs-site
      - docs
      # @bootup:end
    steps:
      - name: Check all results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Results: $results"
          if echo "$results" | grep -q -E '(failure|cancelled)'; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
