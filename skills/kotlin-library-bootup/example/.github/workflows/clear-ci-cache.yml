# GitHub Actions のキャッシュ (Gradle / konan 等) を全削除する。キャッシュ起因の不可解な失敗時に手動実行する。
name: Clear CI Cache

on:
  workflow_dispatch:

permissions:
  actions: write # キャッシュの削除に必要
  contents: read

jobs:
  clear-ci-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clear CI cache
        uses: actions/github-script@v8
        with:
          script: |
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const cache of caches) {
              console.log(`Deleting cache: key ${cache.key} (id=${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }
            console.log(`Deleted ${caches.length} caches`);
