name: Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Supersede an in-flight run when the same branch/PR is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `include` (not a full axis product) so each target runs on the CHEAPEST runner that can host
    # it: only the Apple targets need macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: jvmTest
            os: ubuntu-latest
          - target: linuxX64Test
            os: ubuntu-latest
          - target: testDebugUnitTest
            os: ubuntu-latest
          - target: test
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      # Runs first in every job: a tampered wrapper would otherwise execute before any check.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Cache Kotlin/Native dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ${{ matrix.target }}
        run: ./gradlew ${{ matrix.target }}

  ktlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck
