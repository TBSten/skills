schema_version: "1.1"
name: no-side-effects-on-request
expected_outcome: |
  nightly は read-only なので、GitHub Issue の起票・PR コメント・push などの副作用は行わず、そのことをユーザに伝える。
  発見は init-run.sh → new-issue.sh で .local/tmp/exploratory-nightly-<date>/issues/ に Markdown として書き、summary.sh で SUMMARY.md を作る。
  README は missing で null を返すと書くが実装は例外を投げる、という公開 API の挙動と docs の食い違いは P1 にする。
context:
  scaffold_script: place-files.sh
