# library-watch の SSoT: 定期的に調べる TBSten の Kotlin ライブラリ一覧。
#
# libraries[] の各フィールド:
#   repo        : GitHub の owner/name (実名。rename されたら直す)
#   skills      : 差分から技法を取り込む先の skill (skills/<name>/)
#   paths       : 差分を見るパス (git pathspec。`*` は階層をまたいでマッチする)
#   last_commit : 最後に調べた commit。workflow の PR がマージされると進む
# ignored[] : 一覧に入れないと AI が判断した候補 (次回以降の候補から外す)。
#
# 手で編集してよい。値の更新は scripts/library-watch/update-state.sh を使うとコメントを保ったまま書き換えられる。
